_format_version: "3.0"
services:
  - name: rest-api-service
    url: http://dormant-container:8081/api
    routes:
      - name: rest-api-route
        paths:
          - /api
          - /oauth2
          - /login
          - /logout
plugins:
  - name: cors
    config:
      origins:
        - http://localhost:3000
        - http://localhost:4173
      methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Version
        - Content-Length
        - Content-MD5
        - Content-Type
        - Date
        - Authorization
        - Cookie
      credentials: true
      max_age: 3600
      preflight_continue: false
